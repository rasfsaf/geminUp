plugins {
    id 'com.android.application'
}

def signingValues = [
    path    : System.getenv('GEMINUP_KEYSTORE_PATH'),
    store   : System.getenv('GEMINUP_KEYSTORE_PASSWORD'),
    alias   : System.getenv('GEMINUP_KEY_ALIAS'),
    key     : System.getenv('GEMINUP_KEY_PASSWORD')
]
def hasReleaseSigning = signingValues.values().every { it != null && !it.isBlank() }

android {
    namespace 'io.github.rasfsaf.geminup'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.rasfsaf.geminup"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0.0"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(signingValues.path)
                storePassword signingValues.store
                keyAlias signingValues.alias
                keyPassword signingValues.key
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
