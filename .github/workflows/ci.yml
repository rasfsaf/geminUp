name: Windows CI

on:
  push:
  pull_request:

jobs:
  windows-transport:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Run Windows integration tests
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests\Test-GeminUp.ps1

      - name: Ensure runtime tree contains no generated files
        shell: powershell
        run: |
          $generated = @(Get-ChildItem -Recurse -File -Include *.exe,*.pdb,*.pyc)
          if ($generated.Count) {
            $generated.FullName | Write-Error
            exit 1
          }

  android-client:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build unsigned Android release from source
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - name: Verify committed APK identity and release signature
        shell: pwsh
        run: |
          $apksigner = Get-ChildItem "$env:ANDROID_HOME/build-tools" -Filter apksigner -Recurse |
            Sort-Object FullName -Descending | Select-Object -First 1
          $aapt = Get-ChildItem "$env:ANDROID_HOME/build-tools" -Filter aapt -Recurse |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $apksigner -or $null -eq $aapt) { throw 'Android verification tools are missing.' }
          $signature = @(& $apksigner.FullName verify --verbose --print-certs geminUp.apk 2>&1)
          $signatureExit = $LASTEXITCODE
          $signature | Write-Host
          $signatureText = $signature -join "`n"
          if ($signatureExit -ne 0 -or
              $signatureText -notmatch '358ebf38c834496ee38942f0786bd089ac93178b66c19e814bf579dbe39dbdb5') {
            throw 'geminUp.apk signature or signer verification failed.'
          }
          $badging = @(& $aapt.FullName dump badging geminUp.apk)
          $aaptExit = $LASTEXITCODE
          $badgingText = $badging -join "`n"
          if ($aaptExit -ne 0 -or $badgingText -notmatch "package: name='io.github.rasfsaf.geminup'" -or
              $badgingText -match 'application-debuggable') {
            throw 'Committed geminUp.apk is not the expected production package.'
          }
