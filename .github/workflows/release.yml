name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify release version
        shell: powershell
        run: |
          $controller = Get-Content geminUp.ps1 -Raw -Encoding UTF8
          if ($controller -notmatch '(?m)^\$script:TransportVersion = ''([^'']+)''\r?$') {
            throw 'Cannot read TransportVersion from geminUp.ps1.'
          }
          $expectedTag = "v$($Matches[1])"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Release tag '$env:GITHUB_REF_NAME' does not match transport version '$expectedTag'."
          }

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Test
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests\Test-GeminUp.ps1

      - name: Build release ZIP and checksum
        shell: powershell
        run: |
          $stage = Join-Path $PWD 'artifacts\geminUp'
          New-Item -ItemType Directory -Path (Join-Path $stage 'transport') -Force | Out-Null
          Copy-Item geminUp.bat,geminUp-bootstrap.bat,geminUp.ps1,README.md,SECURITY.md,LICENSE -Destination $stage
          Copy-Item transport\GeminUp.cs,transport\domains.txt,transport\youtube-domains.txt -Destination (Join-Path $stage 'transport')
          Compress-Archive -Path $stage -DestinationPath artifacts\geminUp.zip -CompressionLevel Optimal
          $hash = (Get-FileHash artifacts\geminUp.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText(
            (Join-Path $PWD 'artifacts\geminUp.zip.sha256'),
            "$hash  geminUp.zip`n",
            [Text.Encoding]::ASCII)

      - name: Build and verify signed Android APK
        shell: powershell
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GEMINUP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GEMINUP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GEMINUP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $keystore = Join-Path $env:RUNNER_TEMP 'geminUp-release.jks'
          [IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
          $env:GEMINUP_KEYSTORE_PATH = $keystore
          Push-Location android
          try {
            .\gradlew.bat --no-daemon clean :app:assembleRelease
            if ($LASTEXITCODE -ne 0) { throw 'Android release build failed.' }
          }
          finally {
            Pop-Location
          }
          $apk = 'android\app\build\outputs\apk\release\app-release.apk'
          $apksigner = Get-ChildItem "$env:ANDROID_HOME\build-tools" -Filter apksigner.bat -Recurse |
            Sort-Object FullName -Descending | Select-Object -First 1
          $aapt = Get-ChildItem "$env:ANDROID_HOME\build-tools" -Filter aapt.exe -Recurse |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $apksigner -or $null -eq $aapt) { throw 'Android verification tools are missing.' }
          $signature = @(& $apksigner.FullName verify --verbose --print-certs $apk 2>&1)
          $signatureExit = $LASTEXITCODE
          $signature | Write-Host
          $signatureText = $signature -join "`n"
          if ($signatureExit -ne 0 -or
              $signatureText -notmatch '358ebf38c834496ee38942f0786bd089ac93178b66c19e814bf579dbe39dbdb5') {
            throw 'Signed APK signature or signer verification failed.'
          }
          $badging = @(& $aapt.FullName dump badging $apk)
          $aaptExit = $LASTEXITCODE
          $badgingText = $badging -join "`n"
          if ($aaptExit -ne 0 -or $badgingText -notmatch "package: name='io.github.rasfsaf.geminup'" -or
              $badgingText -match 'application-debuggable') {
            throw 'Android release has unexpected package metadata.'
          }
          Copy-Item $apk artifacts\geminUp.apk
          $hash = (Get-FileHash artifacts\geminUp.apk -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText(
            (Join-Path $PWD 'artifacts\geminUp.apk.sha256'),
            "$hash  geminUp.apk`n",
            [Text.Encoding]::ASCII)
          Remove-Item -LiteralPath $keystore -Force

      - name: Publish GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            artifacts\geminUp.zip `
            artifacts\geminUp.zip.sha256 `
            artifacts\geminUp.apk `
            artifacts\geminUp.apk.sha256 `
            geminUp-bootstrap.bat `
            android\signing-certificate.pem `
            --verify-tag `
            --generate-notes `
            --title "geminUp ${{ github.ref_name }}"
